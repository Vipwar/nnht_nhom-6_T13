name: T13 Automata Lexical Analyzer CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-automata-engine:
    name: Verify Automata Engine & Test Cases (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run 22 Unit & Mathematical Invariant Test Suites
        run: python3 tests/test_suite.py -v

      - name: Run 72 Structured JSON Test Cases via CLI
        run: python3 cli.py test

      - name: Verify Kleene Pipeline, GNFA, Intersection Matrix & Standalone Codegen
        run: |
          python3 cli.py inspect "(a|b)*abb" --test abb aabb ab aba
          python3 cli.py inspect "(a|ba)(a|b)*ba" --test aba baba aabba ba
          python3 cli.py gnfa "(a|b)*abb"
          python3 cli.py gnfa "(nếu|lặp)_[0-9]+€"
          python3 cli.py equiv "(a|b)*" "(a*b*)*"
          python3 cli.py intersections --preset minilang
          python3 cli.py codegen --preset minilang -o /tmp/minilang_lexer.py
          python3 /tmp/minilang_lexer.py --code 'let x = 42; if (x >= 10) { print("ok"); }'

      - name: Run Automata Compilation & O(n) Scanner Benchmark
        run: python3 cli.py benchmark
